variant: flatcar
version: 1.0.0
passwd:
  users:
    - name: core
      ssh_authorized_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF1S1Gmg+f/Q8R77OPvM1Vg3/T09sNla3N8bJ27vkBh+ bernikr
storage:
  files:
    - path: /etc/hostname
      mode: 0644
      overwrite: true
      contents:
        inline: flatcar
    - path: /home/core/.bashrc
      mode: 0755
      contents:
        local: bashrc
      user:
        name: core
      group:
        name: core
    - path: /setup/setup.sh
      mode: 0755
      contents:
        local: setup.sh
    - path: /opt/bin/run-containers
      mode: 0755
      contents:
        local: run-containers.sh
    - path: /opt/bin/backup
      mode: 0755
      contents:
        local: backup.sh
    - path: /etc/smb-credentials
      mode: 0600
      contents:
        local: smb-credentials
    - path: /etc/tmpfiles.d/data-permissions.conf
      mode: 0644
      contents:
        inline: |
          z /data 0775 core core - -
          z /cache 0775 core core - -
    - path: /opt/extensions/docker-compose/docker-compose-2.34.0-x86-64.raw
      mode: 0644
      contents:
        source: https://extensions.flatcar.org/extensions/docker-compose-2.34.0-x86-64.raw
    - path: /etc/sysupdate.docker-compose.d/docker-compose.conf
      contents:
        source: https://extensions.flatcar.org/extensions/docker-compose.conf
    - path: /etc/sysupdate.d/noop.conf
      contents:
        source: https://extensions.flatcar.org/extensions/noop.conf
  filesystems:
    - device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_data
      format: btrfs
      wipe_filesystem: false
      label: data
      path: /data
    - device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_cache
      format: btrfs
      wipe_filesystem: false
      label: cache
      path: /cache
  directories:
    - path: /cache/docker
  links:
    - target: /opt/extensions/docker-compose/docker-compose-2.34.0-x86-64.raw
      path: /etc/extensions/docker-compose.raw
      hard: false
    - target: /cache/docker
      path: /var/lib/docker
      hard: false
systemd:
  units:
    # --- LOCAL FS ---
    - name: data.mount
      enabled: true
      contents: |
        [Unit]
        Description=Mount /data
        Before=local-fs.target
        
        [Mount]
        What=/dev/disk/by-label/data
        Where=/data
        Type=btrfs
        Options=compress=zstd,autodefrag,discard=async
        
        [Install]
        WantedBy=local-fs.target
    
    - name: cache.mount
      enabled: true
      contents: |
        [Unit]
        Description=Mount /cache
        Before=local-fs.target
        
        [Mount]
        What=/dev/disk/by-label/cache
        Where=/cache
        Type=btrfs
        Options=compress=zstd,autodefrag,discard=async
        
        [Install]
        WantedBy=local-fs.target
        
    # --- DATA SHARE ---
    - name: nas-data.mount
      contents: |
        [Unit]
        Description=Mount /nas/data

        [Mount]
        What=//homecloud.lan/data
        Where=/nas/data
        Type=cifs
        Options=credentials=/etc/smb-credentials,iocharset=utf8,vers=3.1.1,uid=500,gid=500,file_mode=0770,dir_mode=0770,_netdev,soft
    
    - name: nas-data.automount
      enabled: true
      contents: |
        [Unit]
        Description=Automount /nas/data
        
        [Automount]
        Where=/nas/data
        TimeoutIdleSec=300
        
        [Install]
        WantedBy=multi-user.target
        
    # --- MEDIA SHARE ---
    - name: nas-media.mount
      contents: |
        [Unit]
        Description=Mount /nas/media
        
        [Mount]
        What=//homecloud.lan/media
        Where=/nas/media
        Type=cifs
        Options=credentials=/etc/smb-credentials,iocharset=utf8,vers=3.1.1,uid=500,gid=500,file_mode=0770,dir_mode=0770,_netdev,soft
    
    - name: nas-media.automount
      enabled: true
      contents: |
        [Unit]
        Description=Automount /nas/media
        
        [Automount]
        Where=/nas/media
        TimeoutIdleSec=300
        
        [Install]
        WantedBy=multi-user.target

    # --- BACKUPS SHARE ---
    - name: nas-backups.mount
      contents: |
        [Unit]
        Description=Mount /nas/backups
        
        [Mount]
        What=//homecloud.lan/backups
        Where=/nas/backups
        Type=cifs
        Options=credentials=/etc/smb-credentials,iocharset=utf8,vers=3.1.1,uid=500,gid=500,file_mode=0770,dir_mode=0770,_netdev,soft
    
    - name: nas-backups.automount
      enabled: true
      contents: |
        [Unit]
        Description=Automount /nas/backups
        
        [Automount]
        Where=/nas/backups
        TimeoutIdleSec=300
        
        [Install]
        WantedBy=multi-user.target
        
    # --- SETUP  SCRIPT ---
    - name: setup.service
      enabled: true
      contents: |
        [Unit]
        Description=Custom Setup Scritps
        ConditionPathExists=!/setup/setup_done
        Before=docker.service, run-containers.service
        After=local-fs.target

        [Service]
        Type=oneshot
        ExecStart=/setup/setup.sh
        ExecStartPost=sudo touch /setup/setup_done
        RemainAfterExit=yes
        User=core
        Group=core

        [Install]
        WantedBy=multi-user.target
    
    # --- DOCKER SERVICE ---
    - name: docker.service
      enabled: true
    
    - name: systemd-sysupdate.timer
      enabled: true
      
    - name: systemd-sysupdate.service
      dropins:
        - name: docker-compose.conf
          contents: |
            [Service]
            ExecStartPre=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/docker-compose.raw > /tmp/docker-compose"
            ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C docker-compose update
            ExecStartPost=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/docker-compose.raw > /tmp/docker-compose-new"
            ExecStartPost=/usr/bin/sh -c "if ! cmp --silent /tmp/docker-compose /tmp/docker-compose-new; then touch /run/reboot-required; fi"
    
    # --- Start Containers ---
    - name: run-containers.service
      enabled: true
      contents: |
        [Unit]
        Description=Run everything
        After=docker.service
        Requires=docker.service

        [Service]
        Type=oneshot
        ExecStart=/opt/bin/run-containers
        RemainAfterExit=yes
        User=core
        Group=core

        [Install]
        WantedBy=multi-user.target
    
    # --- Run Backup ---
    - name: backup.service
      contents: |
        [Unit]
        Description=Snapshot and Rsync to NAS
        After=nas-backups.mount data.mount
        Requires=data.mount nas-backups.mount

        [Service]
        Type=oneshot
        ExecStart=/opt/bin/backup
        
    - name: backup.timer
      enabled: true
      contents: |
        [Unit]
        Description=Run Daily Backup at 2AM

        [Timer]
        # Runs at 2:00 AM every day
        OnCalendar=*-*-* 02:00:00
        Persistent=true

        [Install]
        WantedBy=timers.target
        