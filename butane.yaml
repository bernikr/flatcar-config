variant: flatcar
version: 1.0.0
passwd:
  users:
    - name: core
      ssh_authorized_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF1S1Gmg+f/Q8R77OPvM1Vg3/T09sNla3N8bJ27vkBh+ bernikr
storage:
  files:
    - path: /etc/hostname
      mode: 0644
      overwrite: true
      contents:
        inline: flatcar
    - path: /home/core/.bash_profile
      mode: 0755
      user:
        name: core
      group:
        name: core
      contents:
        inline: |
          if [[ -f ~/.bashrc ]] ; then
            . ~/.bashrc
          fi
          if [[ -z "$TMUX" ]] && ! tty | grep /dev/tty; then
            tmux -u new-session -A -s default
          fi
    - path: /opt/bin/run-containers
      mode: 0755
      contents:
        local: run-containers.sh
    - path: /etc/smb-credentials
      mode: 0600
      contents:
        local: smb-credentials
    - path: /etc/tmpfiles.d/data-permissions.conf
      mode: 0644
      contents:
        inline: |
          z /data 0775 core core - -
          z /cache 0775 core core - -
    - path: /home/core/.docker/config.json
      contents:
        local: docker-config.json
      mode: 0600
      user:
        name: core
      group:
        name: core
    - path: /home/core/.tmux.conf
      contents:
        inline: |
          set -g mouse on
      mode: 0600
      user:
        name: core
      group:
        name: core
    - path: /etc/flatcar/update.conf
      overwrite: true
      contents:
        inline: |
          REBOOT_STRATEGY=reboot
          LOCKSMITHD_REBOOT_WINDOW_START="Thu 04:00"
          LOCKSMITHD_REBOOT_WINDOW_LENGTH=1h
      mode: 0420
    - path: /home/core/setup-chezmoi.sh
      mode: 0755
      user:
        name: core
      group:
        name: core
      contents:
        inline: |
          #!/bin/bash
          /usr/bin/sh -c "$(/usr/bin/curl -fsLS get.chezmoi.io)" -- init --apply bernikr
    - path: /opt/extensions/docker-compose/docker-compose-2.34.0-x86-64.raw
      mode: 0644
      contents:
        source: https://extensions.flatcar.org/extensions/docker-compose-2.34.0-x86-64.raw
    - path: /etc/sysupdate.docker-compose.d/docker-compose.conf
      contents:
        source: https://extensions.flatcar.org/extensions/docker-compose.conf
    - path: /etc/sysupdate.d/noop.conf
      contents:
        source: https://extensions.flatcar.org/extensions/noop.conf
    - path: /opt/bin/nano
      mode: 0755
      contents:
        # Static binary from a reliable community source
        source: https://github.com/andrew-d/static-binaries/raw/cd9bf1f36470b67851fa9218f9b17dd7e28be291/binaries/linux/x86_64/nano
    - path: /opt/bin/tmux
      mode: 0755
      contents:
        source: https://github.com/mjakob-gh/build-static-tmux/releases/download/v3.6a/tmux.linux-amd64.gz
        compression: gzip
  filesystems:
    - device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
      format: ext4
      wipe_filesystem: false
      with_mount_unit: true
      path: /data
    - device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2
      format: ext4
      wipe_filesystem: false
      with_mount_unit: true
      path: /cache
  directories:
    - path: /cache/docker
  links:
    - target: /opt/extensions/docker-compose/docker-compose-2.34.0-x86-64.raw
      path: /etc/extensions/docker-compose.raw
      hard: false
    - target: /cache/docker
      path: /var/lib/docker
      hard: false
systemd:
  units:
    # --- DATA SHARE ---
    - name: nas-data.mount
      contents: |
        [Unit]
        Description=Mount /nas/data

        [Mount]
        What=//homecloud.lan/data
        Where=/nas/data
        Type=cifs
        Options=credentials=/etc/smb-credentials,iocharset=utf8,vers=3.1.1,uid=500,gid=500,file_mode=0770,dir_mode=0770,_netdev,soft,noperm
    
    - name: nas-data.automount
      enabled: true
      contents: |
        [Unit]
        Description=Automount /nas/data
        
        [Automount]
        Where=/nas/data
        TimeoutIdleSec=300
        
        [Install]
        WantedBy=multi-user.target
        
    # --- MEDIA SHARE ---
    - name: nas-media.mount
      contents: |
        [Unit]
        Description=Mount /nas/media
        
        [Mount]
        What=//homecloud.lan/media
        Where=/nas/media
        Type=cifs
        Options=credentials=/etc/smb-credentials,iocharset=utf8,vers=3.1.1,uid=500,gid=500,file_mode=0770,dir_mode=0770,_netdev,soft,noperm
    
    - name: nas-media.automount
      enabled: true
      contents: |
        [Unit]
        Description=Automount /nas/media
        
        [Automount]
        Where=/nas/media
        TimeoutIdleSec=300
        
        [Install]
        WantedBy=multi-user.target
    
    # --- DOCKER SERVICE ---
    - name: docker.service
      enabled: true
    
    - name: systemd-sysupdate.timer
      enabled: true
      
    - name: systemd-sysupdate.service
      dropins:
        - name: docker-compose.conf
          contents: |
            [Service]
            ExecStartPre=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/docker-compose.raw > /tmp/docker-compose"
            ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C docker-compose update
            ExecStartPost=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/docker-compose.raw > /tmp/docker-compose-new"
            ExecStartPost=/usr/bin/sh -c "if ! cmp --silent /tmp/docker-compose /tmp/docker-compose-new; then touch /run/reboot-required; fi"

    # --- Docker Networks ---
    - name: docker-networks.service
      enabled: true
      contents: |
        [Unit]
        Description=Create Global Docker Networks
        After=docker.service
        Requires=docker.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes

        ExecStart=-/usr/bin/docker network create --driver bridge --internal interconnect
        ExecStart=-/usr/bin/docker network create --driver ipvlan --subnet=172.23.0.0/24 -o parent=eth0  lan

        [Install]
        WantedBy=multi-user.target

    # --- Start Containers ---
    - name: run-containers.service
      enabled: true
      contents: |
        [Unit]
        Description=Run everything
        After=docker.service docker-networks.service
        Requires=docker.service docker-networks.service

        [Service]
        Type=oneshot
        ExecStart=/opt/bin/run-containers
        RemainAfterExit=yes
        User=core
        Group=core

        [Install]
        WantedBy=multi-user.target

    # --- Run Cleanup ---
    - name: cleanup.service
      contents: |
        [Unit]
        Description=Cleanup leftover docker volumes and trim filesystems
        After=data.mount cache.mount docker.service
        Requires=data.mount cache.mount docker.service

        [Service]
        Type=oneshot
        ExecStart=/usr/bin/docker system prune -af --volumes
        ExecStart=/usr/bin/fstrim -va

    - name: cleanup.timer
      enabled: true
      contents: |
        [Unit]
        Description=Run Daily Cleanup

        [Timer]
        # Runs at 23:00 AM every day
        OnCalendar=*-*-* 23:00:00
        Persistent=true

        [Install]
        WantedBy=timers.target

    # --- first boot commands ---
    - name: chezmoi-first-boot.service
      enabled: true
      contents: |
        [Unit]
        Description=Run chezmoi init on first boot
        ConditionPathExists=!/home/core/.chezmoi_done
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=oneshot
        User=core
        Group=core
        WorkingDirectory=/home/core
        ExecStart=/home/core/setup-chezmoi.sh
        ExecStartPost=/usr/bin/touch /home/core/.chezmoi_done
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
