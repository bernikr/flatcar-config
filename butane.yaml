variant: flatcar
version: 1.0.0
passwd:
  users:
    - name: core
      ssh_authorized_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF1S1Gmg+f/Q8R77OPvM1Vg3/T09sNla3N8bJ27vkBh+ bernikr
storage:
  files:
    - path: /etc/hostname
      mode: 0644
      overwrite: true
      contents:
        inline: flatcar
    - path: /setup/setup.sh
      mode: 0755
      contents:
        local: setup.sh
    - path: /etc/smb-credentials
      mode: 0600
      contents:
        local: smb-credentials
  filesystems:
    - device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_data
      format: btrfs
      wipe_filesystem: true
      label: data
    - device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_cache
      format: btrfs
      wipe_filesystem: true
      label: cache
systemd:
  units:
    # --- LOCAL FS ---
    - name: data.mount
      enabled: true
      contents: |
        [Unit]
        Description=Mount /data
        Before=local-fs.target
        
        [Mount]
        What=/dev/disk/by-label/data
        Where=/data
        Type=btrfs
        Options=compress=zstd,autodefrag,discard=async
        
        [Install]
        WantedBy=local-fs.target
    
    - name: cache.mount
      enabled: true
      contents: |
        [Unit]
        Description=Mount /cache
        Before=local-fs.target
        
        [Mount]
        What=/dev/disk/by-label/cache
        Where=/cache
        Type=btrfs
        Options=compress=zstd,autodefrag,discard=async
        
        [Install]
        WantedBy=local-fs.target
        
    # --- DATA SHARE ---
    - name: nas-data.mount
      contents: |
        [Unit]
        Description=Mount /nas/data

        [Mount]
        What=//homecloud.lan/data
        Where=/nas/data
        Type=cifs
        Options=credentials=/etc/smb-credentials,iocharset=utf8,vers=3.1.1,uid=1000,gid=1000,file_mode=0770,dir_mode=0777,_netdev,soft
    
    - name: nas-data.automount
      enabled: true
      contents: |
        [Unit]
        Description=Automount /nas/data
        
        [Automount]
        Where=/nas/data
        TimeoutIdleSec=300
        
        [Install]
        WantedBy=multi-user.target
        
    # --- MEDIA SHARE ---
    - name: nas-media.mount
      contents: |
        [Unit]
        Description=Mount /nas/media
        
        [Mount]
        What=//homecloud.lan/media
        Where=/nas/media
        Type=cifs
        Options=credentials=/etc/smb-credentials,iocharset=utf8,vers=3.1.1,uid=1000,gid=1000,file_mode=0770,dir_mode=0777,_netdev,soft
    
    - name: nas-media.automount
      enabled: true
      contents: |
        [Unit]
        Description=Automount /nas/media
        
        [Automount]
        Where=/nas/media
        TimeoutIdleSec=300
        
        [Install]
        WantedBy=multi-user.target

    # --- BACKUPS SHARE ---
    - name: nas-backups.mount
      contents: |
        [Unit]
        Description=Mount /nas/backups
        
        [Mount]
        What=//homecloud.lan/backups
        Where=/nas/backups
        Type=cifs
        Options=credentials=/etc/smb-credentials,iocharset=utf8,vers=3.1.1,uid=1000,gid=1000,file_mode=0770,dir_mode=0777,_netdev,soft
    
    - name: nas-backups.automount
      enabled: true
      contents: |
        [Unit]
        Description=Automount /nas/backups
        
        [Automount]
        Where=/nas/backups
        TimeoutIdleSec=300
        
        [Install]
        WantedBy=multi-user.target
        
    # --- SETUP  SCRIPT ---
    - name: setup.service
      enabled: true
      contents: |
        [Unit]
        Description=Custom Setup Scritps
        ConditionPathExists=!/setup/setup_done
        Before=docker.service
        After=local-fs.target

        [Service]
        Type=oneshot
        ExecStart=/setup/setup.sh
        ExecStartPost=/usr/bin/touch /setup/setup_done
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
    
    # --- DOCKER SERVICE ---
    - name: docker.service
      enabled: true
